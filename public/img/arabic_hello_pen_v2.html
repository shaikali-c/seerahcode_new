<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic Handwriting</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    overflow:hidden;
    display:grid;
    place-items:center;
    background:#fafaf8;
  }
  .scene {
    width:min(94vw,1000px);
    height:360px;
    display:grid;
    place-items:center;
  }
  svg {
    width:min(92vw,900px);
    height:300px;
    overflow:visible;
  }
  .word {
    font-family:"Amiri","Noto Naskh Arabic","Noto Sans Arabic",serif;
    font-size:150px;
    font-weight:400;
    fill:#111;
    letter-spacing:0;
  }
  .ghost {
    font-family:"Amiri","Noto Naskh Arabic","Noto Sans Arabic",serif;
    font-size:150px;
    font-weight:400;
    fill:#111;
  }
  #inkTrail {
    fill:none;
    stroke:#fff;
    stroke-width:105;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1;
    stroke-dashoffset:1;
  }
  #pen {
    fill:#111;
  }
  #penGlow {
    fill:#111;
    opacity:.12;
  }
  button {
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    border:0;
    background:none;
    color:#777;
    font:13px system-ui,sans-serif;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1000 360" aria-label="مرحبا">
  <defs>
    <!-- The mask is a narrow moving ink brush.
         It reveals the real Arabic glyphs underneath rather than drawing
         artificial lines over the word. -->
    <mask id="writeMask" maskUnits="userSpaceOnUse"
          x="0" y="0" width="1000" height="360">
      <rect width="1000" height="360" fill="black"/>

      <!-- Arabic writing motion: right -> left.
           The small vertical movements let the brush naturally enter
           the tall parts of the glyphs instead of making one flat sweep. -->
      <path id="inkTrail"
        pathLength="1"
        d="
          M 760 205
          C 748 198, 735 191, 721 188
          C 708 185, 696 188, 687 196
          C 678 205, 677 219, 684 229
          C 691 239, 704 241, 716 235

          M 681 232
          C 662 226, 646 216, 632 207
          C 616 196, 600 191, 584 196
          C 570 201, 564 215, 568 228
          C 572 241, 583 247, 595 244

          M 566 226
          C 548 218, 532 209, 515 205
          C 498 201, 483 204, 471 214
          C 460 224, 458 238, 466 248
          C 475 259, 490 260, 503 254

          M 468 248
          C 449 247, 431 241, 414 233
          C 396 225, 379 220, 361 222
          C 343 224, 328 233, 320 246

          M 320 246
          C 306 255, 292 258, 278 253
          C 265 248, 257 237, 259 225
          C 261 213, 270 205, 281 204
          C 293 203, 303 210, 307 220
          C 311 231, 307 241, 299 248

          M 278 205
          C 287 191, 291 175, 290 158
          C 289 147, 292 139, 298 132

          M 299 248
          C 281 254, 261 255, 242 250
          C 223 245, 208 235, 197 221
          C 187 208, 178 201, 168 203
          C 157 205, 151 216, 154 227
          C 157 238, 167 245, 179 245
          C 191 245, 202 239, 208 230
        "/>
    </mask>
  </defs>

  <!-- Correctly shaped Arabic text. The browser performs Arabic joining;
       no letters are manually fabricated. -->
  <g mask="url(#writeMask)">
    <text class="word"
          x="500" y="245"
          text-anchor="middle"
          direction="rtl"
          unicode-bidi="plaintext">مرحبا</text>
  </g>

  <!-- tiny pen nib / ink contact point -->
  <circle id="penGlow" cx="760" cy="205" r="14"/>
  <circle id="pen" cx="760" cy="205" r="4.5"/>
</svg>
</div>

<button id="replay">Replay</button>

<script>
const trail = document.getElementById("inkTrail");
const pen = document.getElementById("pen");
const glow = document.getElementById("penGlow");
const replay = document.getElementById("replay");

const pathData = trail.getAttribute("d");

function reset() {
  trail.getAnimations().forEach(a => a.cancel());
  trail.style.strokeDashoffset = "1";
  pen.style.opacity = "0";
  glow.style.opacity = "0";
}

function run() {
  reset();

  const duration = 3900;

  trail.animate(
    [
      { strokeDashoffset: "1" },
      { strokeDashoffset: "0" }
    ],
    {
      duration,
      delay: 250,
      easing: "cubic-bezier(.18,.72,.18,1)",
      fill: "forwards"
    }
  );

  pen.style.opacity = "1";
  glow.style.opacity = "0.12";

  const motion = trail.getTotalLength();
  const start = performance.now() + 250;

  function tick(now) {
    const t = Math.max(0, Math.min(1, (now - start) / duration));
    const eased = 1 - Math.pow(1 - t, 2.15);
    const p = trail.getPointAtLength(motion * eased);

    pen.setAttribute("cx", p.x);
    pen.setAttribute("cy", p.y);
    glow.setAttribute("cx", p.x);
    glow.setAttribute("cy", p.y);

    if (t < 1) requestAnimationFrame(tick);
    else {
      // Pen lifts away after the final stroke.
      setTimeout(() => {
        pen.style.opacity = "0";
        glow.style.opacity = "0";
      }, 180);
    }
  }

  requestAnimationFrame(tick);
}

window.addEventListener("load", () => setTimeout(run, 400));
replay.addEventListener("click", run);
document.addEventListener("click", e => {
  if (e.target !== replay) run();
});
</script>
</body>
</html>
